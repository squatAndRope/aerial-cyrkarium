<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aerial · Fundacja Cyrkarium</title>
  <meta name="description" content="Studia aerial, wydarzenia i ogłoszenia w Polsce w jednym miejscu. Prowadzi Fundacja Cyrkarium.">
  <!-- Strona w budowie: wyszukiwarki mają jej nie indeksować. Usuń przy starcie (i zmień robots.txt). -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%234B3373' d='M50 0C55 32 68 45 100 50C68 55 55 68 50 100C45 68 32 55 0 50C32 45 45 32 50 0Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Unbounded:wght@300;500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <!-- Po każdej zmianie w styles.css, i18n.js albo app.js podbij V we wszystkich trzech miejscach. -->
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <svg class="masthead-star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0C55 32 68 45 100 50C68 55 55 68 50 100C45 68 32 55 0 50C32 45 45 32 50 0Z"/></svg>
    <div class="masthead-inner">
      <header class="top">
        <a class="brand" href="#studia">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M50 0C55 32 68 45 100 50C68 55 55 68 50 100C45 68 32 55 0 50C32 45 45 32 50 0Z"/></svg></span>
          <span class="brand-text">
            <span class="eyebrow">Fundacja Cyrkarium</span>
            <span class="brand-name" data-i="brand"></span>
          </span>
        </a>
        <div class="top-actions">
          <div class="account" id="account"></div>
          <div class="lang" role="group" data-aria="ariaLang">
            <button type="button" data-lang="pl">PL</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
      </header>
      <nav class="sections" role="tablist" data-aria="ariaSections">
        <a role="tab" href="#kalendarz" data-view="kalendarz"><span class="dot dot-cal" aria-hidden="true"></span><span data-i="tabCalendar"></span></a>
        <a role="tab" href="#studia" data-view="studia"><span class="dot dot-map" aria-hidden="true"></span><span data-i="tabStudios"></span></a>
        <a role="tab" href="#ogloszenia" data-view="ogloszenia"><span class="dot dot-mkt" aria-hidden="true"></span><span data-i="tabBoard"></span></a>
      </nav>
    </div>
  </div>

  <div id="notice" aria-live="polite"></div>

  <!-- STUDIA -->
  <section id="view-studia" class="view">
    <div class="lead">
      <div class="lead-text">
        <h1 data-i="studiosTitle"></h1>
        <p id="studios-count" class="muted"></p>
      </div>
      <a class="btn primary" href="#dodaj-studio" data-i="addStudio"></a>
    </div>
    <div class="filters">
      <div class="chips" id="disc-chips"></div>
      <div class="filters-row">
        <input id="f-q" type="search" data-ph="searchStudios" data-aria="searchStudios" autocomplete="off">
        <select id="f-level" data-aria="ariaLevel"></select>
        <label class="toggle"><input type="checkbox" id="f-kids"> <span data-i="kidsOnly"></span></label>
      </div>
    </div>
    <div class="explore">
      <div class="mapbox"><div id="map" role="region" data-aria="ariaMap"></div></div>
      <div class="list" id="studio-list"></div>
    </div>
    <section class="profile" id="studio-profile" hidden></section>
  </section>

  <!-- DODAJ / EDYTUJ STUDIO -->
  <section id="view-dodaj-studio" class="view" hidden>
    <div id="add-box"></div>
  </section>

  <!-- MOJE STUDIA I MODERACJA -->
  <section id="view-moje" class="view" hidden>
    <div id="mine-box"></div>
  </section>

  <!-- KALENDARZ -->
  <section id="view-kalendarz" class="view" hidden>
    <div class="lead">
      <div class="lead-text">
        <h1 data-i="calTitle"></h1>
        <p class="muted" data-i="calLede"></p>
      </div>
      <a class="btn primary" id="cal-link" target="_blank" rel="noopener" data-i="calOpen"></a>
    </div>
    <div class="events" id="event-list"></div>
  </section>

  <!-- OGŁOSZENIA -->
  <section id="view-ogloszenia" class="view" hidden>
    <div class="soon">
      <h1 data-i="boardTitle"></h1>
      <p class="muted" data-i="boardLede"></p>
      <ul class="promise">
        <li data-i="boardP1"></li>
        <li data-i="boardP2"></li>
        <li data-i="boardP3"></li>
      </ul>
    </div>
  </section>

  <footer class="foot">
    <div class="foot-inner">
      <span data-i="footer"></span>
      <span class="foot-links">
        <a href="https://cyrkarium.com" target="_blank" rel="noopener">cyrkarium.com</a>
        <a id="foot-events" target="_blank" rel="noopener">Aerial Events</a>
      </span>
    </div>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
