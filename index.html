<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aerial · Fundacja Cyrkarium</title>
  <!-- Strona w budowie: wyszukiwarki mają jej nie indeksować. Usuń przy starcie. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%234B3373' d='M50 0C55 32 68 45 100 50C68 55 55 68 50 100C45 68 32 55 0 50C32 45 45 32 50 0Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Unbounded:wght@300;500&display=swap">
  <style>
    :root { --violet: #4B3373; --lime: #D1DFA8; --lilac: #CAC2DF; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--violet); color: #FFFFFF;
      font-family: "DM Sans", "Segoe UI", system-ui, sans-serif; line-height: 1.5;
      display: grid; place-items: center; overflow: hidden;
      padding: 24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px));
    }
    .star { position: fixed; right: -80px; top: 50%; width: min(70vw, 560px); translate: 0 -50%; fill: var(--lime); opacity: .14; }
    main { position: relative; max-width: 560px; display: flex; flex-direction: column; gap: 16px; }
    .eyebrow { font-family: "Unbounded", system-ui, sans-serif; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); }
    h1 { margin: 0; font-family: "Unbounded", system-ui, sans-serif; font-weight: 300; font-size: clamp(28px, 6vw, 44px); line-height: 1.15; }
    p { margin: 0; color: var(--lilac); font-size: 17px; }
    a { color: var(--lime); }
  </style>
</head>
<body>
  <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 0C55 32 68 45 100 50C68 55 55 68 50 100C45 68 32 55 0 50C32 45 45 32 50 0Z"/></svg>
  <main>
    <span class="eyebrow">Fundacja Cyrkarium</span>
    <h1>Aerial w Polsce, wkrótce w jednym miejscu</h1>
    <p>Mapa studiów, kalendarz wydarzeń i ogłoszenia. Pracujemy nad tym.</p>
    <p>Na razie zajrzyj do <a href="https://aerialevents.cyrkarium.com">kalendarza Aerial Events</a> albo na <a href="https://cyrkarium.com">cyrkarium.com</a>.</p>
  </main>
</body>
</html>
